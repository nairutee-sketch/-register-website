<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>calculator</title>
	 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
          <style>
          	body {
          		background : linear-gradient(135deg, #dbeafe, #eef2ff);
          		min-height: 100vh;
          		display: flex;
          		justify-content: center;
          		align-items: center;
          		font-family: Arial, sans-serif;
          	}
          	.calculator{
          		width: 350px;
          		background: white;
          		padding : 20px;
          		border-radius: 20px;
          		box-shadow: 0 10px 30px rgba(0,0,0,0.2);
          	}
          	h2 {
          		text-align: center;
          		color: #2878d0;
          		margin-bottom: 20px;
          		font-weigth: bold;
          	}
          	.display {
            width: 100%;
            height: 75px;
            background: #263442;
            color: white;
            font-size: 32px;
            text-align: right;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: none;
        }
         .btn {
            height: 58px;
            width: 100%;
            font-size: 22px;
            font-weight: bold;
            border-radius: 10px;
        }

        .number {
            background-color: #263442;
            color: white;
        }
         .number:hover {
            background-color: #46596d;
            color: white;
        }

        .operator {
            background-color: #2878d0;
            color: white;
        }

        .operator:hover {
            background-color: #165eaf;
            color: white;
        }
         .clear {
            background-color: #dce3eb;
            color: #263442;
        }

        .equal {
            background-color: #ff9f2e;
            color: white;
        }

        .equal:hover {
            background-color: #ed8b16;
            color: white;
        }


          </style>
</head>
<body>
<div class="calculator">
	<h2> calculator </h2>
	<input type ="text" class="display" value="0" readonly>
	<div class ="row g-2">
		<div class ="col-3">
			<button class ="btn clear">C</button></div>

			<div class="col-3">
				<button class="btn clear">+/-</button></div>

				<div class="col-3">
					<button class="btn clear">%</button></div>

					<div class="col-3">
						<button class="btn operator">/</button></div>

						<div class="col-3">
							<button class="btn number">7</button></div>

							<div class="col-3">
								<button class="btn number">8</button></div>
								<div class="col 3">
									<button class="btn number">9</button></div>

<div class="col-3">
<button class="btn operator">x</button></div>

<div class="col-3">
	<button class="btn number">4</button></div>
	<div class="col-3">
		<button class="btn number">5</button></div>
		<div class="col-3">
			<button class="btn number">6</button></div>

<div class="col-3">
<button class="btn operator">-</button></div>
<div class="col-3">
<button class="btn number">1</button></div>
<div class="col-3">
<button class="btn number">2</button></div>
<div class="col-3">
<button class="btn number">3</button></div>
<div class ="col-3">
<button class="btn operator">+</button></div>
<div class ="col-6">
<button class="btn number">0</button></div>
<div class="col-3">
<button class="btn number">.</button></div>
<div class="col-3">
	<button class="btn equal">=</button></div>
</div>
<p class="text-center text-secondary mt-3 mb-0"> my calculator </p>
</div>








</body>
</html>
