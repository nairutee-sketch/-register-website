<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">

	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0beta.2/css/bootstrap.min.css">

	<link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

	 <div class="container mt-4">

    <h2>My Image Carousel</h2>

    <div id="myCarousel" class="carousel slide" data-ride="carousel">

        <!-- Indicators -->
        <ul class="carousel-indicators">
            <li data-target="#myCarousel" data-slide-to="0" class="active"></li>
            <li data-target="#myCarousel" data-slide-to="1"></li>
            <li data-target="#myCarousel" data-slide-to="2"></li>
        </ul>

        <!-- Images -->
        <div class="carousel-inner">

            <div class="carousel-item active">
                <img src="C:\Users\Nairuti\Desktop\bootstrap\bootstrap carousel\images.jpg" class="d-block w-100">
            </div>

            <div class="carousel-item">
                <img src="C:\Users\Nairuti\Desktop\bootstrap\bootstrap carousel\images.jpg"class="d-block w-100">
            </div>

            <div class="carousel-item">
                <img src="C:\Users\Nairuti\Desktop\bootstrap\bootstrap carousel\images.jpg" class="d-block w-100">
            </div>

        </div>

        <!-- Previous button -->
        <a class="carousel-control-prev"
           href="#myCarousel"
           data-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </a>

        <!-- Next button -->
        <a class="carousel-control-next"
           href="#myCarousel"
           data-slide="next">
            <span class="carousel-control-next-icon"></span>
        </a>

    </div>

</div>		
</body>
</html>
