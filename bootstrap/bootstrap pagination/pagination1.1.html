<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>pagination1.1</title>
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0beta.2/css/bootstrap.min.css">   
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>   
	<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.6/umd/popper.min.js"></script>   
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0beta.2/js/bootstrap.min.js"></script> 
</head>
<body>
<ul class="pagination">       
	<li><a href="#">1</a></li>       
	<li><a href="#">2</a></li>   
</ul> 
<!-- active state-->
<li class="active"><a href="#">2</a></li>

<!--disabled state -->
<li class="disabled"><a href="#">4</a></li>

<!-- pagination sizing-->
<ul class="pagination pagination-lg">       
	<li><a href="#">1</a></li>       
	<li><a href="#">2</a></li>  
</ul> 
</body>
</html>
