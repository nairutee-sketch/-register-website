<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>badge1.10</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0beta.2/css/bootstrap.min.css">

	 <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container">
	<h2> badge example</h2>
	<a href="#">news<span class="badge">9</span></a>
	<a href="#">updates<span class="badge">8</span></a>
	<a href="#">call<span class="badge">7</span></a></div>

	<div class="container">
		<h2> badge label example</h2>
		<h1>updates<span class="label label-default">new</span></h1>
		<h2>updates<span class="label label-default">new</span></h2>
		<h3>updates<span class="label label-default">new</span></h3>
		<h4>updates<span class="label label-default">new</span></h4>
		<h5>updates<span class="label label-default">new</span></h5>
		<h6>updates<span class="label label-default">new</span></h6>
	</div>

	<div class="container">
		<h2> phill badge example</h2>

		<span class="badge badge-phill badge-primary">primary</span>
		<span class="badge badge-phill badge-secondary">secondary</span>
		<span class="badge badge-phill badge-warning">warning</span>
		<span class="badge badge-phill badge-danger">danger</span>
		<span class="badge badge-phill badge-success">success</span>
		<span class="badge badge-phill badge-light">light</span>
		<span class="badge badge-phill badge-dark">dark</span>



</body>
</html>
