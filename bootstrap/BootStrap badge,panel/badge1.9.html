<div class="container">
	<h2> badge example</h2>
	<a href="#">news<span class="badge">3</span></a>

	<a href="#">calls<span class="badge">2</span></a></div>

<div class="container">
	<h2> phill badge example</h2>

<span class="badge badge-phill badge-primary">primary</span>
<span class="badge badge-phill badge-secondary">secondary</span>
<span class="badge badge-phill badge-warning">warning</span>
<span class="badge badge-phill badge-success">success</span>
