<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>list group</title>
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
      <link rel="stylesheet" href="bootstrap.min.css">
      <link rel="stylesheet" href="../css/bootstrap.min.css">
      <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0beta.2/css/bootstrap.min.css">   
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>   
	<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.6/umd/popper.min.js"></script>   
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0beta.2/js/bootstrap.min.js"></script> 
	<link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
          <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
	 <ul class="list-group">
        <li class="list-group-item">Apple</li>
        <li class="list-group-item">Mango</li>
        <li class="list-group-item">Orange</li>
        <li class="list-group-item">Banana</li>
    </ul>
    <br>
<!-- list group with colors (contextual classes.) -->
    <ul class="list-group">
    <li class="list-group-item active">Home</li>
    <li class="list-group-item list-group-item-info">About</li>
    <li class="list-group-item list-group-item-success">Success</li>
    <li class="list-group-item list-group-item-warning">Warning</li>
    <li class="list-group-item list-group-item-danger">Danger</li>
</ul>
<!-- list group with badge-->
<br>
<li class="list-group-item">
	<span class="badge">12</span> new </li>
	<br> 
<!--active and disable list group-->
<a href="#" class="list-group-item disabled">First item(This is disable item)</a>   
<a href="#" class="list-group-item active">First item (This is active item)</a>
</body>
</html>
