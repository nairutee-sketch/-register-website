<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

  <link rel="stylesheet"
href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<link rel="https://getbootstrap.com/docs/4.6/components/forms/?utm_source=chatgpt.com#form-controls">

	<!--<link rel="form-control" href= "https://getbootstrap.com/docs/4.6/components/forms/?utm_source=chatgpt.com#form-controls">

	<link rel="form-group" href="https://getbootstrap.com/docs/4.6/components/forms/?utm_source=chatgpt.com#form-groups">-->

	<title>bootstrap form2.2</title>

</head>
<body>
<!--.form-group → adds spacing around the form field.
.form-control → gives inputs, textareas, and selects the Bootstrap styling.-->

<div class="form-group">
	<label> Name:</label>
	<input type="text" class="form-control"></div>

<input type="text" class="form-control">
<textarea class="form-control"></textarea>
<select class="form-control">
<option> USA </option>
<option> India</option>
</select>

<!--1) vertical form-->
<form>
	<div class="form-group">
		<label>Name:</label>
		<input type="text" class="form-control">
    <div class="form-group">
		<label>Email:</label>
		<input type="Email" class="form-control">
	</div>
	<button type="Submit" class="btn btn-primary">Submit</button>
</form>

<!-- 2) Inline form -->
<form class="form-inline">
	<label class="mr-2"> Name:</label>
	<input type="text" class="form-control mr-2">
	<label class="mr-2">Email:</label>
	<input type="Email" class="form-control mr-2">
	<button type="Submit" class="btn btn-primary">Submit</button>
<br>
<!-- 3) horizontal form -->
<br>
<br>
<form>
	<div class="form-group">
		<label class="col-sm-2 col-form-label">name:</label>
      <div class="col-sm-10">
      	<input type="text" class="form-control">
      </div>
  </div>
  <div class="form-group">
		<label class="col-sm-2 col-form-label">E-mail:</label>
      <div class="col-sm-10">
      	<input type="email" class="form-control">
      </div>
  </div>
  <div class="form-group row">
  	<div class="col-sm-10 offset-sm-2">
  		<button type="submit" class="btn btn-primary">Submit</button>

  	</div>
  </div>
</form>

<!-- form -->
<form> 
	<div class="form-group">
		<label> Username:</label>
		<input type="text" class="form-control" placeholder="enter your name"></div>
		<div class="form-group">
			<label> Password:</label>

	<input type="password" class="form-control" placeholder="enter password here"></div>
	<button type="Submit" class="btn btn-primary">Submit</button></form>


</body>
</html>
