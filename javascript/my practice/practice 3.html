	//13) print number from 1 to 20 but stop when no is 10 using break.

	var a;
   for(a=1;a<=20;a++){
	if(a==10)

}

//14) print numbers from 1 to 20, but skip multiples of 3 using continue.

var a;
for(a=1;a<=20;a++){
	if(a%3==0)
		continue;
	document.write(a+"<br>");
}

//15) print numbers from 1 to 50. Print only odd numbers using a loop and continue.

var a;
for(a=1;a<=50;a++){
	if(a%2==0)
		continue;
	document.write(a+"<br>");
}
