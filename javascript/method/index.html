<!-- JavaScript Functions 
JavaScript functions are used to perform 
operations. We can call JavaScript 
function many times to reuse the code. 
 
Advantage of JavaScript function 
There are mainly two advantages of 
JavaScript functions. 
Code reusability: We can call a function 
several times so it save coding. 
Less coding: It makes our program 
compact. We don’t need to write many 
lines of code each time to perform a common task. 

.......................................................

1. console.log()
Displays output in the console.
console.log("Hello World");


2. alert()
Shows a popup message.
alert("Welcome!");

3. prompt()
Takes input from the user.
let name = prompt("Enter your name");
document.write(name);

4. confirm()
Displays an OK/Cancel dialog.
let result = confirm("Do you want to continue?");
document.write(result);


5. parseInt()
Converts a string into an integer.
let x = parseInt("25");
document.write(x);

6. parseFloat()
Converts a string into a decimal number.
var x = parseFloat("12.5");
document.write(x);


7. Number()
Converts a value to a number.
let n = Number("100");
document.write(n);


8. String()
Converts a value into a string.
let s = String(123);
document.write


9. Boolean()
Converts a value into true or false.
document.write(Boolean(1));
document.write(Boolean(0));


10. isNaN()
Checks whether a value is Not a Number.
document.write(isNaN("Hello"));
document.write(isNaN(25));

11. Math.random()
Generates a random number.
document.write(Math.random());


12. Math.floor()
Rounds down to the nearest integer.
document.write(Math.floor(5.9));


13. Math.ceil()
Rounds up to the nearest integer.
document.write(Math.ceil(5.1));


14. Math.round()
Rounds to the nearest integer.
document.write(Math.round(5.6));


15. Math.max()
Returns the largest value.
document.write(Math.max(10, 20, 30));


16. Math.min()
Returns the smallest value.
document.write(Math.min(10, 20, 30));


17. setTimeout()
Executes code after a specified time.
setTimeout(() => {
    document.write("Hello");
}, 2000);


18. setInterval()
Repeats execution after a specified interval.
setInterval(() => {
    ("Running");
}, 1000);

19. Date()
Gets the current date and time.
let d = new Date();
document.write(d);

20. Array.push()
Adds an element to the end of an array.
let arr = [1, 2, 3];
arr.push(4);
document.write(arr);


21. Array.pop()
Removes the last element.
let arr = [1, 2, 3];
arr.pop();
document.write(arr);

22. Array.shift()
Removes the first element.
let arr = [10, 20, 30];
arr.shift();
document.write(arr);

23. Array.unshift()
Adds an element at the beginning.
let arr = [20, 30];
arr.unshift(10);
document.write(arr);


24. Array.includes()
Checks if an element exists.
let arr = [10, 20, 30];
document.write(arr.includes(20));


25. String.length
Returns the number of characters.
let str = "JavaScript";
document.write(str.length);


26. toUpperCase()
Converts text to uppercase.
let str = "hello";
document.write(str.toUpperCase());


27. toLowerCase()
Converts text to lowercase.
let str = "HELLO";
document.write(str.toLowerCase());


28. trim()
Removes spaces from both ends.
let str = "  Hello  ";
document.write(str.trim());


29. split()
Splits a string into an array.
let str = "A,B,C";
console.log(str.split(","));

30. join()
Joins array elements into a string.
let arr = ["A", "B", "C"];
document.write(arr.join("-"));


31. indexOf()
Returns the index of an element.
let arr = [10, 20, 30];
document.write(arr.indexOf(20));


32. slice()
Extracts part of an array or string.
let arr = [10, 20, 30, 40];
document.write(arr.slice(1, 3));


33. replace()
Replaces text in a string.
let str = "I like Java";
document.write(str.replace("Java", "JavaScript"));
