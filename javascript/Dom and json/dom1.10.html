<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>dom1.10</title>
</head>
<body>
<script>
	document.write("hello javascipt");
	document.writeln("this is");
	document.writeln("javascipt");

function show(){
alert(document.form1.username.value);
}

function byid(){
	alert(document.getElementById("idd").value);
}
function byname(){
	var n = document.getElementsByName("gender");
	document.write(n.length);
}
function bytag(){
	var tg = document.getElementsByTagName("p");
	document.write(tg.length);
}
function byclass(){
	var cl = document.getElementsByClassName("demo");
	document.write(cl.length);
}

function aa(){
	var i = document.getElementById("demo1").innerHTML = "<b> javascipt </b>";
}
function aaa(){
	var j = document.getElementById("demo2").innerText ="<b> js</b>";
}
</script>
<form name="form1">
	<input type="text" name="username">
	<input type="button" onclick="show();" value="click">
	 </form>

<input type="text" id="idd">
<input type="button" onclick="byid();" value="click click">

<input type="radio" name="gender" value="male">male
<input type="radio" name="gender" value="female">female
<button onclick="byname();">click me </button>

<p> paragragh1</p>
<p> paragragh2</p>
<button onclick="bytag();"> click click </button>

<p class="demo"></p>
<button onclick="byclass();"> click plz </button>

<p id="demo1"></p>
<button onclick="aa();">clk</button>

<p id="demo2"></p>
<button onclick="aaa();">submit</button>
</body>
</html>
