<html>
<head>

	<title>dom1.2</title>

<body>
<script>

document.write("welcome to javascript" +"<br>");

function showName(){
	alert(document.form1.username.value);
}

function show(){

}

function a()
{
	var g = document.getElementsByName("gender");
	document.write(g.length);
}

function n(){
	var d= document.getElementsByTagName("p");
document.write(d.length);
}

function s() {
var c = document.getElementsByClassName("demo");
document.write(c.length);
}

function aa(){
document.getElementById("demo").innerHTML = "<b>Hello</b>";
}

function aaa(){
	document.getElementById("dss").innerText ="welcome to js";
}
