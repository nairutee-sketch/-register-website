<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>operator1.1</title>
</head>
<body>
	<script>
		// arthematic operator are +,-,*,/;

		var a=10;
		var b=20;
          var c=30;
		document.write(a+b);
		document.write("<br>");
		document.write(a-b);
		document.write("<br>");
		document.write(a*b);
		document.write("<br>");
		document.write(a/b);
		document.write("<br>");

		//comparision operator are <,>,<=,>=,==,!=
		document.write(a>b);
		document.write("<br>");
		document.write(a<b);
		document.write("<br>");
		document.write(a<=b);
		document.write("<br>");
		document.write(a>=b);
		document.write("<br>");
		document.write(a==b);
		document.write("<br>");
        document.write(a!=b);
   
   //logical operator are &&, ||,!
        document.write (a>b && a>c);
		document.write("<br>");
		document.write(a>b && a<c);
		document.write("<br>");
		document.write (a<b && a<c);
		document.write("<br>");
		document.write(a<b && a>c);

		document.write (a>b || a>c);
		document.write("<br>");
		document.write(a>b || a<c);
		document.write("<br>");
		document.write (a<b || a<c);
		document.write("<br>");
		document.write(a<b || a>c);

		document.write (!(a>b && a>c));
		document.write("<br>");
		document.write(!(a>b && a<c));
		document.write("<br>");
		document.write (!(a<b && a<c));
		document.write("<br>");
		document.write(!(a<b && a>c));
		document.write("<br>");

		//bitwise operator are & , |, ^
		document.write(a & b);
		 document.write("<br>");
		 document.write(a | b);
		 document.write("<br>");
		 document.write (a ^ b);
		 document.write("<br>");

		// increment , decrement operator are ++, --

		 document.write(a++);
		 document.write("<br>");
		 document.write(b--);
		 document.write("<br>");

		 //special opeartor 
		 document.write(a>b?a:b);
		 document.write("<br>");


	</script>
 
</body>
</html>
