<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>operator1.4</title>
</head>
<body>
	<script> 
		var a=10;
		var b=20;
		var c=30;
        //arthematic operator
		document.write(a+b);
		document.write("<br>");
		document.write(a-b);
		document.write("<br>");
		document.write(a*b);
		document.write("<br>");
		document.write(a/b);
		document.write("<br>");

		//comparison operator
		document.write(a<b); //t
		document.write("<br>");
		document.write(a>b);//f
		document.write("<br>");
		document.write(a<=b);//f
		document.write("<br>");
		document.write(a>=b);//f
		document.write("<br>");
		document.write(a==b);//f
		document.write("<br>");
		document.write(a!=b);//t
		document.write("<br>");

		//logical operator

		document.write(a>b && a>c); //f
		document.write("<br>");
		document.write(a>b && a<c); //f
		document.write("<br>");
		document.write(a<b && a<c);//t
		document.write("<br>");
		document.write(a<b && a>c);//f
		document.write("<br>");

		document.write(a>b || a>c); //f
		document.write("<br>");
		document.write(a>b || a<c); //t
		document.write("<br>");
		document.write(a<b || a<c);//t
		document.write("<br>");
		document.write(a<b || a>c);//t
		document.write("<br>");

		document.write(!(a>b || a>c)); //t
		document.write("<br>");
		document.write(!(a>b || a<c)); //f
		document.write("<br>");
		document.write(!(a<b || a<c));//f
		document.write("<br>");
		document.write(!(a<b || a>c));//f

		//bitwise

		document.write(a^b);
		document.write("<br>");
		document.write(a&b);
		document.write("<br>");
		document.write(a|b);
		document.write("<br>");

		//increment & decrement

		document.write(++a);//11
		document.write("<br>");
		document.write(--a);//10
		document.write(a); //10
		document.write("<br>");

		//special operator//tretanory operator
		document.write(a<b?a:b); //10




	</script>

</body>
</html>
