<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>program</title>
</head>
<body>
<script>
	//area of circle
	var r = 10;
	 area = 3.14 *r *r;

     //area of triangle
	 var base = 20;
	var height = 30;
	 triangle = 1/2 * base * height;

	 //area of rectangle
	 var length= 45;
	 var width = 45;
	 rectangle = length * width;

	 //simple interest
	 var p= 100;
	 var I= 25;
	 var T= 2;
	 SI = p*I*T/100;
	 
	document.write("area of circle is" +area+ "<br>");
	document.write("area of triangle is " + triangle + "<br>");
	document.write("area of rectangle is" +rectangle+ "<br>");
	document.write("simple interest is" + SI+"<br>");

	
</script>
</body>
</html>
