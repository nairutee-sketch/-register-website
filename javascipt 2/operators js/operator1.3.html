<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>operator1.3</title>
</head>
<body>
      <script>
      		var a=10;
      		var b=20;
      		var c=30;
      		//arthematic operators.
      		 document.write(a+b);
      		 document.write("<br>");
      		 document.write(a-b);
      		 document.write("<br>");
      		 document.write(a*b);
      		 document.write("<br>");
      		 document.write(a/b);
      		 document.write("<br>");

      		 //comparision opearators
               document.write(a<b);
               document.write("<br>");
               document.write(a>b);
               document.write("<br>");
               document.write(a<=b);
               document.write("<br>");
               document.write(a>=b);
               document.write("<br>");
               document.write(a==b);
               document.write("<br>");
               document.write(a!=b);
               document.write("<br>");

               //logical operator
               document.write(a>b && a>c);
               document.write("<br>");
               document.write(a>b && a<c);
               document.write("<br>");
               document.write(a<b && a<c);
               document.write("<br>");
               document.write(a<b && a>c);
               document.write("<br>");
               
               document.write(a>b || a>c);
               document.write("<br>");
               document.write(a>b || a<c);
               document.write("<br>");
               document.write(a<b || a<c);
               document.write("<br>");
               document.write(a<b || a>c);
               document.write("<br>");

               document.write(!(a>b && a>c));
               document.write("<br>");
               document.write(!(a>b && a<c));
               document.write("<br>");
               document.write(!(a<b && a<c));
               document.write("<br>");
               document.write(!(a<b && a>c));
               document.write("<br>");

               //bitwise operator
               document.write(a&b);
               document.write("<br>");
               document.write(a^b);
               document.write("<br>");
               document.write(a|b);
               document.write("<br>");

               //increment and decrement

               document.write(a++); //10 prefix
               document.write(++a);//11 postfix
               document.write("<br>");
               document.write(b--); // 20
               document.write(--b);// 18
               document.write("<br>");

               //special operator
               document.write(a>b?a:b);//20
</script>
</body>
</html>
