<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>
<script>
	// arthematic +, * ,/ ,-
	var a = 10;
	var b = 20;
	var c = 30;
	document.write(a+b);
	document.write("<br>");
	document.write(a-b);
	document.write("<br>");
	document.write(a*b);
	document.write("<br>");
	document.write(a/b);
	document.write("<br>");
// comparision == , != , <, >,<= , >=
	document.write(a>b);
	document.write("<br>");
	document.write(a<b);
	document.write("<br>");
	document.write(a>=b);
	document.write("<br>");
	document.write(a<=b);
	document.write("<br>");
	document.write(a==b);
	document.write("<br>");
	document.write(a!=b);
	document.write("<br>");
	//logical && , || , !
   document.write(a>b && a>c);
	document.write("<br>");
	 document.write(a>b && a<c);
	document.write("<br>");
	 document.write(a<b && a<c);
	document.write("<br>");
	 document.write(a<b && a>c);
	document.write("<br>");

 document.write(a>b || a>c);
	document.write("<br>");
	 document.write(a>b || a<c);
	document.write("<br>");
	 document.write(a<b || a<c);
	document.write("<br>");
	 document.write(a<b || a>c);
	document.write("<br>");

 document.write(!(a>b && a>c));
	document.write("<br>");
 document.write(!(a>b && a<c));
	document.write("<br>");
 document.write(!(a<b && a<c));
	document.write("<br>");
 document.write(!(a<b && a>c));
	document.write("<br>");

// bitwise & , | , ^
document.write(a & b);
	document.write("<br>");
	document.write(a | b);
	document.write("<br>");
	document.write(a ^ b);
	document.write("<br>");

	//inc and dec
	document.write(a++);
	document.write("<br>");
	document.write(a--);
	document.write("<br>");

	// special operator
	document.write(a>b?a:b);
	document.write("<br>");
</script>
</body>
</html>
