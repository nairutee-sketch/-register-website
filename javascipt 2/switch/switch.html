<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>switch</title>
</head>
<body>
<script>
	var a = "monday";
	switch (a)
	{
		case "monday":
		document.write("this is monday");
		break;
		case "tuesday":
		document.write("this is tuesday");
		break;
		case "wednesday":
		document.write("this is wednesday");
		break;
	default:
		document.write("invalid input");

	}

	
</script>
</body>
</html>
