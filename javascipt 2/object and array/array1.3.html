<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>array1.3</title>
</head>
<body>
<script>

	var a = [1,2,3,4,5,6];
	document.write(a);

	document.write("<br>");

	var i;
	var country = ["india","usa","newzealand"];
	for(i=0;i<country.length;i++){
		document.write(country[i]+"<br>");
	}
   document.write("<br>");
	//using new keyword

	var num;
	var country = new Array();
	country[0]="japan";
	country[1]="usa";
	country[2]="india";
	for(num=0;num<country.length;num++){
		document.write(country[num] +"<br>");
	}
  document.write("<br>");

//array constructor
var employee = new Array("rohit","vivek","john");
for(var i=0;i<employee.length;i++){
	document.write(employee[i] + "<br>");
}
document.write("<br>");

var cars=["bmw","toyota","gtf"];
document.write(cars[1]);

document.write("<br>");

document.write(cars[0]);
document.write("<br>");

var last =[cars.length-1];
document.write(last);
document.write("<br>");

cars[1] = "ferrari";
document.write(cars +"<br>");
document.write("<br>");

cars.push("gtr");
document.write(cars+"<br>");
document.write("<br>");

cars.pop();
document.write(cars);
document.write("<br>");

var arr1=[1,2];
var arr2=[3,4];
document.write(arr1.concat(arr2));
document.write("<br>");

//foreach()

var mynumber = [1,2,3,4,5];
mynumber.forEach(num => {
	document.write(num);
});



</script>
</body>
</html>
