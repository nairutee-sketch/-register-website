<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>array1.4</title>
</head>
<body>
<script>
	var a =[1,2,3,4,5];
	document.write(a);
document.write("<br>");

	var i;
	var country = ["india","usa","russia"];
	for(i=0;i<country.length;i++){
		document.write(country[i] + "<br>");
	}
	document.write("<br>");

var num;
var count = new Array();
count[0] ="japan";
count[1] = "india";
count[2] ="usa";

for(num=0;num<count.length;num++){
	document.write(count[num] + "<br>");
}
document.write("<br>");

var name = new Array("rohit","jay","harsh");
for(var i=0;i<name.length;i++){
	document.write(name[i]);
}
document.write("<br>");

var cars = ["bmw","accord","honda"];
document.write(cars[0]);
document.write("<br>");
document.write(cars[1]);
document.write("<br>");

var last = [cars.length-1];
document.write(last);

document.write("<br>");

cars[1]="ferrari";
document.write(cars +"<br>");
document.write("<br>");
cars.push("accord");
document.write(cars +"<br>");
document.write("<br>");
cars.pop();
document.write(cars +"<br>");
document.write("<br>");
var arr1=[1,2];
var arr2=[3,4];

document.write(arr1.concat(arr2));
document.write("<br>");

var  mynumber = [1,2,3,4,5];
mynumber.forEach(num => {
	document.write(num);
});

</script>
</body>
</html>
