<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>string1.3</title>
</head>
<body>
<script>

	var str = "javascript";
	document.write(str);
    document.write("<br>");

	var str = new String("javascript");
	document.write(str);
	document.write("<br>");


	//string method
	//1) char At()
    var text="javascript string"
	document.write(text.charAt(11));
	document.write("<br>");

//2)concat()
	var str1 ="java";
	var str2="script";
	document.write(str1.concat(str2));
	document.write("<br>");


//3) indexOf()
	document.write(text.indexOf('t'));
	document.write("<br>");

//4) lastIndexOf()
	document.write(text.lastIndexOf('p'));
	document.write("<br>");

//5) toLowerCase()
	var txt ="PROGRAMMING"
	document.write(txt.toLowerCase());
document.write("<br>");

	//6) toUpperCase()
	document.write(text.toUpperCase());
document.write("<br>");

//7) slice()
document.write(text.slice(11,17));
</script>
</body>
</html>
