<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>string1.2</title>
</head>
<body>
	<script>
		var str = "javascript";
		document.write(str);

		document.write("<br>");

		//string object
		var name = new String("programming")
		document.write(name);
		document.write("<br>");

		//string methods

	//1) charAt()
		var text ="javascript"
		document.write(text.charAt(7));
		document.write("<br>");
	//2) concat()
		var str1="java";
		var str2="script";
		document.write(str1.concat(str2));
		document.write("<br>");

	//3) indexOf()
		document.write(text.indexOf('c'));
		document.write("<br>");

	//4)lastIndexOf()
		document.write(text.lastIndexOf('p'));
        document.write("<br>");

		//5)ToUpperCase()
        var text="software";
		document.write(text.toUpperCase());
        document.write("<br>");

		//6)ToLowerCase()
		var txt ="PROGRAMMING";
		document.write(txt.toLowerCase());
        document.write("<br>");

		//7)slice()
		document.write(txt.slice(3,11));
		document.write("<br>");

	</script>

</body>
</html>
