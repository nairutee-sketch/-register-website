<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>string1.4</title>
</head>
<body>
<script>
	var str = "javascript programming";
	document.write(str);
    document.write("<br>");

	var str1 = new String("script");
	document.write(str1);
	document.write("<br>");

	//string methods

	//1) char At()
	document.write(str.charAt(4));
document.write("<br>");

	//2) concat()
	var str1 = "20";
	var str2="26";
	document.write(str1.concat(str2));
	document.write("<br>");

	//3)indexOf()
	document.write(str.indexOf('g'));
document.write("<br>");

	//4)lastindexOf()
	document.write(str.lastIndexOf('m'));
	document.write("<br>");

//5)toLowercase()
	var str = "JAVASCRIPT";
	document.write(str.toLowerCase(str));
document.write("<br>");

	//6) toUpperCase()
	var str ="javascript";
	document.write(str.toUpperCase(str));
document.write("<br>");

	//7) slice()
	document.write(str.slice(3,8));
	document.write("<br>");

</script>
</body>
</html>
