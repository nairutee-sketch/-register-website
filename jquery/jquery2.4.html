<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>jquery2.4</title>
	<script src="http://ajax.googleapis.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script><script>

$(document).ready(function(){
	$("#flip").click(function(){
		$("#panel").slideDown();
	});
});

$(document).ready(function(){
	$("#flip").click(function (){
		$("#panel").slideUp();
	});
});

$(document).ready(function(){
	$("#flip").click(function (){
		$("#panel").slideToggle();
	});
});

$(document).ready(function(){
	$("button").click(function(){
		$("div").animate({
			left:'250px',
			width:'+=150px',
			height:'+=150px'
		});

	});
});

</script>
<style>
	#flip,#panel{
		padding:5px;
		background-color: yellowgreen;
		text-align: center;
		border: 1px solid black;
	}
	#panel{
		padding: 50px;
		/*display:none;*/
	}
</style>
</head>
<body>
<div id="flip">click here to slide up</div>
<div id="panel">hii jquery</div>

<button>start animation</button>
<div style="width:100px ;height:100px ;position:absolute ;background-color:yellow"></div>

</body>
</html>
