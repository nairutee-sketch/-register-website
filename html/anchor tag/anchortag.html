<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Anchor tag</title>
</head>
<body link="orange" alink="yellow" vlink="green">
	<!-- In HTML, link, alink, and vlink are attributes used inside the <body> tag to control the colors of text hyperlinks based on their state. However, these attributes are obsolete and deprecated in HTML5. Modern web development uses CSS pseudo-classes to achieve this styling instead -->
		
		<!-- Core Definitions link: Controls the color of a standard, unvisited hyperlink. The browser default is usually blue.

		alink (Active Link): Controls the color of a hyperlink at the exact moment it is clicked and held down. The browser default is usually red.

		vlink (Visited Link): Controls the color of a hyperlink that the user has already visited in the past. The browser default is usually purple or magenta. -->

       <a href="https://www.google.com/"> Google </a><br><br>


       <a href="https://www.google.com/" target= "_blank" > Google </a>

       <!-- target="_blank" is an attribute added to a hyperlink (<a>) that tells the web browser to open the linked page in a new tab or window, rather than replacing the current page -->
</body>
</html>
