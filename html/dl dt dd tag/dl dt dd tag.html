<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>dl dt dd tags</title>
</head>
<body>
<!-- <dl> (Description List): The parent wrapper element that contains the entire list.<dt> (Description Term): The specific term, name, or key being defined.
<dd> (Description Details): The actual definition, description, or value matching the term -->
  <dl>
  	<dt> html </dt>
  	<dd> hyper text markup language </dd>

  	<dt>SD</dt>
  	<dd>software developer</dd>
  </dl>
  </dl>
</body>
</html>
