<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>css2.9</title>
	<style>
		p{
			display: inline;
		}
		div {
			width: 100px;
			height: 100px;
			border: 1px solid black;
			border-color: teal;
			border-width: 10px;
			border-radius: 50px;
			border-style: inset;
		}
		button {
			background-color: whitesmoke;
			border-radius: 3px;
			border-style: inset;
			color: steelblue;
			float: left;
			font-family: sans-serif;
			font-weight: bold;
			font-style: italic;
			font-variant: small-caps;
			font-size: x-large;
			box-shadow: 1px 1px 1px 1px black;

		}
	</style>
</head>
<body>
<div> </div> <br> <br>
<p style="cursor:col-resize;"> home </p>
<p style ="cursor: cell;"> home </p> <br> <br>
<button> submit </button>
</body>
</html>
