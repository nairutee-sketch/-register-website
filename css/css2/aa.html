<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<!-- done by sir -->
	<style>
		div {
			width: 300px;
			height: 300px;
			border: 1px solid black;
			border-style: dotted;
			border-width: 5px;
			border-bottom-color: darkred;
			border-radius: 100%;
		}
		p {
			display: block;
		}
		button{
			background-color: skyblue;
			border-style: groove;
			border-radius: 50px;
			box-shadow: 1px 2px 3px 2px black;
			float: right;
			color: red ;
			font-family: sans-serif;
			font-size: 20px;
			font-variant: small-caps;
			font-style: italic;
			font-weight: bolder;
		}
	</style>
</head>
<body>
<div></div>
<p style="cursor: pointer;">Home</p>
<p style="cursor:progress;">Home</p>
<p style="cursor:col-resize;">Home</p>
<p>Home</p>
<p>Home</p>
<br>
<button>submit</button>
</body>
</html>
