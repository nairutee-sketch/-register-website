<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>css2.1</title>
	<style>
		div {

			width:500px;
			height:500px;
			border: 1px solid blue ;
			/* below are the border properties */
			border-style: groove;
			border-width: 1px;
			border-bottom-color: indianred;
			border-radius: 100%;
		}
		p{  /* these are the display properties */
			display: block;
		}

		button {
			/* these are the button properties */
			background-color: deepskyblue;
			border-style: solid;
			border-radius: 50%;
			box-shadow: 1px 2px 3px 2px cadetblue;
            float: right; /* this is a css float property */
            /* this is a css font property*/
			color: mintcream;
			font-family: serif;
			font-size: 20px;
			font-variant: small-caps;
			font-style: italic;
			font-weight: bolder;
		}
		
	</style>
</head>
<body>
<div></div>

<br>

<p> home </p>
<!-- below are the cursor properties -->
<p style="cursor: alias;"> home </p>
<p style="cursor:all-scroll;"> home </p>
<p style="cursor: col-resize;"> home </p>
<p style="cursor: auto;"> home </p>
<p style="cursor:cell;"> home </p>

<br>
<button>Submit</button>
</body>
</html>
