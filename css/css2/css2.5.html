<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>css2.5</title>
	<style>
		div {
			width: 100px;
			height: 100px;
			border: 1px solid black;
			border-radius:100px;
			border-style: inset;
			border-color: blue;
			border-width: 100px;
		}
		p{
			display: inline;
		}
		button {
			background-color: teal;
			border-style: inset;
			border-radius: 2 px;
			box-shadow: 1px 1px 1px 1px black;
			float: left;
			color: black;
			font-family: sans-serif;
			font-size: x-large;
			font-style: italic;
			font-variant: small-caps;
			font-weight: bold;
		}
	</style>
</head>
<body>
<div> </div> <br> <br>
<p> home </p>
<p style="cursor:coll-resize;"> home </p>

<p style="cursor:cell;"> home </p>
<br> <br>
<button> submit </button>
</body>
</html>
