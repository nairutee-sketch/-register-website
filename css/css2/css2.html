<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>css2</title>
	<style>
		div{
			width: 500px;
			height: 500px;
			border: 1px solid grey;
			border-style: ridge;
			border-color: linen;
			border-width: 10px;
			border-radius: 50%;
		}

		p{
			display: inline;
		}
		button{
			background-color: lemonchiffon;
			border-style: ridge;
			border-radius: 30%;
			box-shadow : 0 8px 16px 0 black; 
			float: right;
			font-family: cursive;
			color: sandybrown;
			font-size: 10px;
			font-style: oblique;
			font-variant: normal;
			font-weight: bold;
		}
	</style>
</head>
<body>
      <div>
      </div><br>

</body>
