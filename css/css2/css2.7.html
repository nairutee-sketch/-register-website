<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>css2.7</title> 
	<style>
		p{
			display: inline;
		}
		div {
			width: 100px;
			height: 100px;
			border: 1px solid black;
			border-width: 10px;
			border-radius: 5px;
			border-style: ridge;
			border-color: blue;
		}
		button {
			background-color: whitesmoke;
			border-style: ridge;
			border-radius:  5px;
			float: left;
			font-family: sans-serif;
			font-weight: bold;
			font-size: x-large;
			font-variant: small-caps;
			font-style: italic;
			box-shadow: 1px 1px 1px 1px blueviolet;
			color: black;
		}
	</style>
</head>
<body>
	<div> </div> <br>
	<p style ="cursor: col-resize;"> home </p>
	<p style ="cursor: cell;"> home </p> <br> <br>
	<button> submit </button>

</body>
</html>
