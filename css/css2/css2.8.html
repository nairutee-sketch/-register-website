<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>css2.8</title>
		<style> 
			p {
				display : inline;
			}
			div {
				width : 100px;
				height : 100px ;
				border: 1px solid black;
				border-radius: 5px;
				border-color: blue;
				border-style: inset;
				border-width: 10px ;
			}
			button {
				background-color: whitesmoke;
				box-shadow: 1px 1px 1px 1px black;
				font-family: sans-serif;
				color: black;
				font-style: italic;
				font-variant: small-caps;
				font-size: x-large;
				border-radius: 5px;
				border-style: ridge;
				float: left;
				font-weight: bold;
			}
		</style>
</head>
<body>
<div> </div> <br>
<p style ="cursor : col-resize;"> home </p> <br>
<p style="cursor : cell;"> home </p> <br> <br>
<button> submit </button>
</body>
</html>
