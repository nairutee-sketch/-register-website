<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>2.4</title>
	<style>
		div {
			width:400px;
			height: 400px;
			border: 1px solid turquoise;
			border-radius: 200px;
			border-style: ridge;
			border-color: royalblue;
			border-width: 100px;

		}
		p {
			display: inline;
		}
        button {
        	background-color: royalblue;
        	border-style: inset;
        	border-radius: 2px;
        	box-shadow: 1px 2px 1px 1px black;
        	float: left;
        	color: black;
        	font-family: sans-serif;
        	font-size: x-large;
        	font-style: italic;
        	font-variant: small-caps;
        	font-weight: bold;


        }

	</style>
</head>
<body>
<div></div> <br> <br>
<p> home </p>
<p style="cursor: coll-resize;"> home </p>
<p style="cursor: cell;"> home </p> <br> <br>
<button> submit </button>
</body>
</html>
