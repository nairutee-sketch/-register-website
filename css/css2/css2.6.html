<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>css2.6</title> 
	<style>
		p{
			display: inline;
		}
		div {
			width: 100px;
			height: 100px;
			border: 1px solid black;
			border-width: 10px;
			border-radius: 50px;
			border-style: ridge;

		}
		button {
			background-color : teal;
			border-style: inset;
			border-radius: 2px;
			box-show: 1px 1px 1px 1px black;
			float: left;
			color: black;
			font-family:sans-serif;
			font-size: x-large;
			font-style: italic;
			font-variant: small-caps;
			font-weight: bold;
		}
	</style>
</head>
<body>
<div> </div> <br>
