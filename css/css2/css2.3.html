<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>css2.3</title>
	<style>
		div{
			width:200px;
			height: 200px;
			border: 1px solid hotpink;
			border-color: pink;
			border-radius: 10%;
			border-style: inset;
            border-width: 5px;
		}
		p{
			display: inline;
		}
		button{
			background-color: slateblue;
			border-style:outset;
			border-radius: 4%;
			box-shadow: 1px 8px 6px 1px black;
			float:right;
			color: black;
			font-family: cursive;
			font-size: x-large;
			font-style: normal;
			font-variant: normal;
			font-weight: bold;

		}
	</style>
</head>
<body>
<div></div> <br> <br>
<p> home </p>
<p style="cursor: auto;"> home </p>
<p style ="cursor: all-scroll;"> home </p>

<button>submit </button>
</body>
</html>
