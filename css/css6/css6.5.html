<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>css6.5</title>
	<style> 
		.normal {
			font-stretch: normal;
		}
		.condensed {
			font-stretch: semi-condensed;
		}
		.expanded{
			font-stretch: expanded;
		}
		.top {
			vertical-align: text-top;
		}

		.container{
			display:flex;
			justify-content: space-around;
			flex-direction: row;
			align-items: center;
			height: 200px;
			border: 2px solid black;
		}
		.container div {
			width: 80px;
			height: 80px;
			background: gray;
			margin: 10px;
			text-align: center;
			line-height: 80px;
			font-size: 20px;
		}

	</style>
</head>
<body>
<p class="normal"> this is a normal text </p>
<p class="condensed"> this is a semi-condensed text </p>
<p class="expanded"> this is a expanded text </p>
<p> <img src="a.jpeg" class="top" width="300px" height="300px"> this is text at top </p>
<div class="container"> 
	<div> 1 </div>
	<div> 2 </div>
	<div> 3 </div>
	<div> 4 </div>
</div>
</body>
</html>
