<!DOCTYPE html>
<html>
<head>
<style>
.container{
    display:flex;
    flex-direction:row;
    justify-content:space-around;
    align-items:center;
    height:200px;
    border:2px solid black;
}

.container div{
    width:80px;
    height:80px;
    background:skyblue;
    margin:10px;
    text-align:center;
    line-height:80px;
    font-size:20px;
}
</style>
</head>
<body>

<div class="container">
    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
</div>

</body>
</html>
