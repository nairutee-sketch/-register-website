<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>animation3</title>
	<style> 
		div {
			width: 100px;
			height: 200px;
			border: 1px solid black;
			background: linear-gradient(red,orange);
			/*transform: skew(15deg);
			transform: rotate(45deg);
			transform: scale(1.0);
			transform: translate(100px);*/

			animation: SD 1s infinite;
			animation-duration: 10s;
			animation-delay: 3s;
			animation-direction: reverse;

		}
		/*@keyframes SD {
			to {
				width: 400px;
				height: 100px;
				background: yellowgreen;
			}
			from {
				width: 200px;
				height: 100px;
				background: darkgrey;
			}
		}*/
		@keyframes SD {
			0%{
				width: 300px;
				height: 200px;
				background: cadetblue;
				transform: skew(15deg);
				margin-top: 100px;
				transform: translate(100px);
			}
			25% {
				width: 300px;
				height: 200px;
				background: skyblue;
				transform: skew(15deg);
				margin-top: 100px;
				transform: translate(100px);
				transform :rotate(45deg);
			}
			50% {
				width: 300px;
				height: 200px;
				background:blue;
				transform: skew(15deg);
				margin-top: 100px;
				transform: translate(100px);
				transform:rotate(45deg);
				border-color: green;
				border-width: 10px;
				border-style: double;


			}
			75% {
				width: 300px;
				height: 200px;
				background: olivedrab;
				transform: skew(15deg);
				margin-top: 100px;
				margin-bottom: 100px;
				transform: translate(100px);
				transform:rotate(45deg);
				border-color: green;
				border-width: 10px;
				border-style: double;
			}
			100% {
				width: 200px;
				height: 100px;
				border-radius: 100%;
				border-width: 5px;
				border-color: mediumseagreen;
				background: orange;
			}
		}
	</style>
</head>
<body>
<div> <div>
</body>
</html>
