<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>animation1</title>
	<style> 
		div {
			width: 200px;
			height:200px;
			border: 1px solid black;
			/*background: radial-gradient(yellow,blue,violet,red);*/
			background: linear-gradient(yellow,blue,violet,red);
			/*transform: scale(1.5);
			transform: skew(15deg);
            transform: rotate(45deg);
            transform: translate(100px);*/

            animation: SoftwareDeveloper 1s infinite;
            animation-duration: 10s;
            animation-delay: 5s;
            animation-direction: reverse;
            }
            @keyframes SoftwareDeveloper {
            	to {
            		background:yellow;
            		width:400px;
            		height:100px;
            	}
            	from {
            		background:orange;
            		width:200px;
            		height:100px;
            	}
            }
            @keyframes SoftwareDeveloper{
            	0%{
            		width: 100px;
            		height: 200px;
            		background: violet;
            		margin-top:100px;
            		transform:translate(10px);
            		transform:skew(50deg);
            	}
            	25%{
            		width: 200px;
            		height: 400px;
            		background: violet;
            		margin-top:100px;
            		transform:translate(10px);
            		transform:skew(50deg);
            		transform:rotate(45deg);
            	}
            	50%{
            		width: 200px;
            		height: 400px;
            		background: red;
            		margin-top:100px;
            		transform:translate(10px);
            		transform:skew(50deg);
            		transform:rotate(45deg);
            		border-width:10px;
            		border-style:double;
            		border-color: red;

            	}
            	75%{
            		width: 200px;
            		height: 400px;
            		background: greenyellow;
            		margin-top:200px;
            		margin-bottom: 100px;
            		transform:translate(10px);
            		transform:skew(50deg);
            		transform:rotate(45deg);
            		border-width:10px;
            		border-style:double;
            		border-color: red;

            	}
            	100% {
            		width: 400px;
            		height:400px;
            		border-radius:100%;
            		background:darkmagenta;
            		border-width:10px;
            		border-style: groove;
            	}

            }

	</style>
</head>
<body>
<div> </div>
</body>
</html>
