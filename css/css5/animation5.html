<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>animation5</title>
	<style> 
		div {
			width: 300px;
			height: 300px;
			border: 1px solid black;
			background: linear-gradient(red,green,yellow,red);
			/*transform: translate(100px);
			transform: scale(1.0);
			transform: rotate(45deg);
			transform:skew(10deg);*/
            animation: sd 1s infinite;
            animation-direction: reverse;
            animation-delay: 1s;
            animation-duration: 10s;
            }
           /* @keyframes sd {
            	to {
            		width: 300px;
            		height: 300px;
            		background: yellow;
            	}
            	from{
            		width: 500px;
            		height: 200px;
            		background: orangered;
            	}
            }*/
            @keyframes sd {
            	0% {
            		width: 300px;
            		height: 200px;
            		background: yellow;
            		margin-top: 100px;
            		transform : skew(10deg);
            		transform: translate(100px);
            	}
            	25% {
            		width: 300px;
            		height: 200px;
            		background: orange;
            		margin-top: 100px;
            		transform : skew(10deg);
            		transform: translate(100px);
            		transform: rotate(10deg);
            	}
            	50% {
            		width: 300px;
            		height: 200px;
            		background: orange;
            		margin-top: 100px;
            		transform : skew(10deg);
            		transform: translate(100px);
            		transform: rotate(10deg);
            		border-style:double;
            		border-width: 3px;
            		border-color: slateblue;

            	}
            	75%{
            		width: 300px;
            		height: 200px;
            		background: orange;
            		margin-top: 100px;
            		margin-bottom: 100px;
            		transform : skew(10deg);
            		transform: translate(100px);
            		transform: rotate(10deg);
            		border-style:double;
            		border-width: 3px;
            		border-color: slateblue;

            	}
            	100% {
            		width: 400px;
            		height: 300px;
            		background: springgreen;
            		border-radius: 100%;
            		border-color: red;
            		border-width: 2px;
            	}
            }
	</style>
</head>
<body>
<div> </div>
</body>
</html>
