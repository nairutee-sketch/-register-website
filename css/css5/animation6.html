<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>animation6</title>
	<style> 
		div {
			width: 300px;
			height: 100px;
			border: 1px solid black;
			background: linear-gradient(red, green,yellow,orange);
			/*transform: translate(10px);
			transform: scale(1.3);
			transform: rotate(45deg);
			transform: skew(10deg);*/
			animation: sd 1s infinite;
			animation- direction: reverse;
			animation-delay: 1s;
			animation-duration: 10s;

		}
		/*@keyframes sd {
			to {
				width: 200px;
				height: 100px;
				background: orange;
			}
			from {
				width: 400px;
				height: 300px;
				background: yellowgreen;
			}
		}*/
        @keyframes sd {
        	0% {
        		width: 200px;
        		height: 100px;
        		background: orange;
        		transform: skew(10deg);
        		transform:scale(1.3);
        		margin-top: 100px;
        	}
        	25% {
        		width: 200px;
        		height: 100px;
        		background: yellow;
        		transform: skew(10deg);
        		transform:scale(1.3);
        		transform: rotate(45deg);
        		margin-top: 100px;
        	}
        	50% {
        		width: 200px;
        		height: 100px;
        		background: skyblue;
        		transform: skew(10deg);
        		transform:scale(1.3);
        		transform: rotate(45deg);
        		margin-top: 100px;
        		border-width: 3px;
        		border-style: double;
        		border-color: red;

        	}
        	75% {
        		width: 200px;
        		height: 100px;
        		background: skyblue;
        		transform: skew(10deg);
        		transform:scale(1.3);
        		transform: rotate(45deg);
        		margin-top: 100px;
        		margin-bottom:100px;
        		border-width: 3px;
        		border-style: double;
        		border-color: red;
        	}
        	100% {
        		width: 200px;
        		height: 100px;
        		background: gold;
        		border-color: red;
        		border-radius: 100%;
        		border-width: 3px;
        		border-style: double;
        	}
        }
	</style>
</head>
<body>
<div> </div>
</body>
</html>
