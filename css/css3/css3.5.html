<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>css3.5</title>
	<style>
		p{
			line-height: 20px;
		}
		h1{
			margin: 150px;
		}
		div {
			width: 100px;
			height: 100px;
			border: 1px solid black;
			background: black;
			opacity: 0.3;
		}
		.a {
			filter: brightness(200%);
		}
		.b{
			filter:blur(5px);
		}
		.c{
			filter: invert(100%);
		}
		.d {
			filter: saturate(400%);
		}
		.e {
			filter: grayscale(100%);
		}
		.f {
			filter:  drop-shadow( 10px 20px 30px red);
		}
	</style>
</head>
<body>
<p> home </p>
<p> home </p>
<h1> welcome home </h1>
<div> </div>
<img src="images.jpg"width="100" height="100" class="a">
<img src="images.jpg"width="100" height="100" class="b">
<img src="images.jpg"width="100" height="100" class="c">
<img src="images.jpg"width="100" height="100" class="d">
<img src="images.jpg"width="100" height="100" class="e">
<img src="images.jpg"width="100" height="100" class="f">

</body>
</html>
