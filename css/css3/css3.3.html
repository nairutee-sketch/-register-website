<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>css3.3</title>
	<style>
		p{
			line-height: 30px;
		}
		h1 {
			margin-left: 30px;
		}
		div {
			width: 70px;
			height: 70px;
			border : 1px solid red;
			background: red;
			opacity: 0.2;
		}
		.a {
			filter: brightness(20%);
		}
		.b {
			filter:blur(5px);
		}
		.c {
			filter:invert(30%);
		}
		.d {
			filter: saturate(40%);
		}
		.e{
			filter:grayscale(50%);
		}
		.f{
			filter: drop-shadow(10px 20px 30px green);
		}

	</style>
</head>
<body>
     <p> hello</p>
     <p> hello </p>
     <h1> hello world </h1>
     <div> </div>
     <img src="pngtree-the-bengal-tiger-emblem-of-wild-image_16362570.jpg" width="100px" height ="100px" class="a"> 
     <img src="pngtree-the-bengal-tiger-emblem-of-wild-image_16362570.jpg" width="100px" height ="100px" class="b">
     <img src="pngtree-the-bengal-tiger-emblem-of-wild-image_16362570.jpg" width="100px" height ="100px" class="c">
     <img src="pngtree-the-bengal-tiger-emblem-of-wild-image_16362570.jpg" width="100px" height ="100px" class="d">
     <img src="pngtree-the-bengal-tiger-emblem-of-wild-image_16362570.jpg" width="100px" height ="100px" class="e">
     <img src="pngtree-the-bengal-tiger-emblem-of-wild-image_16362570.jpg" width="100px" height ="100px" class="f">
</body>
</html>
