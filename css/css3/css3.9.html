<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>css3.9</title>
	<style>
		p{
			line-height: 100px;
		}
		h1 {
			margin-left: 100px;
		}
		div {
			width: 100px;
			height: 100px;
			border : 1px solid black;
			background: black;
			opacity: 0.5;
		}
		.a {
			filter: brightness(100%);
		}
		.b {
			filter: blur(5px);
		}
		.c {
			filter: invert(200%);
		}
		.d {
              filter : saturate(400%);
		}
		.e {
			filter: grayscale(200%);
		}
		.f {
			filter: drop-shadow(10px 20px 30px black);
		}
	</style>
</head>
<body>
<p> hello</p>
<p> hello </p>
<h1> hello world </h1>
<div> </div> <br> <br> 
<img src="images (1).jpg" width="100px" height="100px" class="a">
<img src="images (1).jpg" width="100px" height="100px" class="b">
<img src="images (1).jpg" width="100px" height="100px" class="c">
<img src="images (1).jpg" width="100px" height="100px" class="d">
<img src="images (1).jpg" width="100px" height="100px" class="e">
<img src="images (1).jpg" width="100px" height="100px" class="f">
</body>
</html>
