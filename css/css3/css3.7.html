<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>css3.7</title>
	<style>
		p{
			line-height: 100px;
		}
		h1{
			margin-left: 100px;
		}
		div {
			width: 100px;
			height: 100px;
			border: 1px solid black;
			background: black;
			opacity: 0.5;
		}
		.a {
			filter: brightness(200%);
		}
		.b {
			filter: blur(5px);
		}
		.c {
			filter : invert(150%);
		}
		.d {
			filter: saturate(200%);
		}
		.e {
			filter: grayscale(200%);
		}
		.f {
			filter: drop-shadow(10px 20px 30px yellow);
		}
	</style>
</head>
<body>
<p> home </p>
<p> home </p>
<h1> welcome home </h1>
<div> </div> <br> <br>

<img src="pngtree-the-bengal-tiger-emblem-of-wild-image_16362570.jpg" width=100px height= 100px class="d">
<img src="pngtree-the-bengal-tiger-emblem-of-wild-image_16362570.jpg" width=100px height= 100px class="e">
<img src="pngtree-the-bengal-tiger-emblem-of-wild-image_16362570.jpg" width=100px height= 100px class="f">
</body>
</html>
