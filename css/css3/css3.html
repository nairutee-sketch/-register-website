<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>css3</title>
	<style> 
		p{  
			line-height: 10px; /* line height */
		}

		div { /* opacity property */
			width: 15px;
			height: 15px;
			border: 2px solid black;
			background: darkorange;
			opacity: 0.9;

		}
		h1 {
			margin-left: 100px; /* margin properties */
		} 
            /* below are the filter properties */
		.a{
			filter:brightness(190%);
		}
		.b{
			filter:blur(5px);
		}
		.c{
			filter:saturate(190%);
		}
		.d {
			filter:invert(80%);
		}
		.e{
			filter:dropshadow(10px 20px 30px darkorange);
		}
		.f {
			filter:grayscale(100%);
		}

	</style>
</head>
<body>
<p> hello </p>
<p> hello </p>
<p> hello </p> 
<h1> hello world </h1> 
<div><div> 
<img src="FE9655B7-5566-43AF-A9F8-D7A2C3A59BB6.jpg" width="100" height="100" class="a">
<img src="FE9655B7-5566-43AF-A9F8-D7A2C3A59BB6.jpg" width="100" height="100" class="b">
<img src="FE9655B7-5566-43AF-A9F8-D7A2C3A59BB6.jpg" width="100" height="100" class="c">
<img src="FE9655B7-5566-43AF-A9F8-D7A2C3A59BB6.jpg" width="100" height="100" class="d">
<img src="FE9655B7-5566-43AF-A9F8-D7A2C3A59BB6.jpg" width="100" height="100" class="e">
<img src="FE9655B7-5566-43AF-A9F8-D7A2C3A59BB6.jpg" width="100" height="100" class="f">





</body>
</html>
