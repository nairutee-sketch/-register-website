<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>css3.2</title>
	<style>
		p{
			line height: 30px;
		}
		h1{
			margin-left: 150px;
		}
		div {
			width: 100px;
			height: 100px;
			border: 1px solid yellow;
			background: yellow;
			opacity: 0.2;
		}
		.a {
			filter: brightness(60%);
		}
		.b {
			filter: blur(10px);
		}
		.c{
			filter: invert(60%);
		}
		.d {
			filter: saturate(30%);
		}
		.e {
			filter: drop-shadow(10px 20px 30px pink);
		}
		.f {
			filter: grayscale(50%);
		}
	</style>
</head>
<body>
<p> hello </p>
<p> hello </p>
<h1> hello world </h1>
<div> </div>
<img src="images.jpg" width=100px height ="100px" class="a">
<img src="images.jpg" width=100px height ="100px" class="b">  
<img src="images.jpg" width=100px height ="100px" class="c"> 
<img src="images.jpg" width=100px height ="100px" class="d"> 
<img src="images.jpg" width=100px height ="100px" class="e"> 
<img src="images.jpg" width=100px height ="100px" class="f"> 

</body>
</html>
