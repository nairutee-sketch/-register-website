<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>css3.1</title> 
	<style> 
		p{
			line-height: 50px;
		}
		h1{
			margin-left : 150px;
		}
		div {
			width: 100px;
			height: 100px;
			border: 1px solid black;
			background:  darkorange;
			opacity: 0.5;
		}
		.a {
			filter: brightness(25%);

		}
		.b {
			filter:blur(2px);
		}
		.c{
			filter:invert(100%);

		}
		.d {
			filter:saturate(190%);
		}
		.e {
			filter: grayscale(90%);
		}
		.f {
			filter: drop-shadow(10px 20px 30px yellow);
		}

	</style>
</head>
<body>
<p> hello </p>
<p> hello </p>
<h1> hello world </h1>
<div> </div>
<img src="photo-1606041008023-472dfb5e530f.avif"width= "100px" height ="100px" class="a">
<img src="photo-1606041008023-472dfb5e530f.avif"width= "100px" height ="100px" class="b">
<img src="photo-1606041008023-472dfb5e530f.avif"width= "100px" height ="100px" class="c">
<img src="photo-1606041008023-472dfb5e530f.avif"width= "100px" height ="100px" class="d">
<img src="photo-1606041008023-472dfb5e530f.avif"width= "100px" height ="100px" class="e">
<img src="photo-1606041008023-472dfb5e530f.avif"width= "100px" height ="100px" class="f">

</body>
</html>
