<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>3.6.html</title>
	<style>
		p{
			line-height: 30px;
		}
		h1 {
			margin-left: 100px;
		}
		div {
			width: 100px;
			height :100px;
			border: 1px solid black;
			background: black;
			opacity: 0.5;


		}
		.a {
			filter: brightness(200%);
		}
		.b {
			filter: blur(5px);
		}
		.c {
			filter: invert(200%);
		}
		.d {
			filter: saturate(500%);
		}
		.e {
			filter: grayscale(200%);
		}
		.f {
			filter: drop-shadow(10px 20px 30px black);
		}


	</style>
</head>
<body>
<p> home </p>
<p> home </p>
<h1> welcome home </h1>
<div> </div> <br> <br> 
<img src="images (1).jpg" width="100" height="100" class="a">
<img src="images (1).jpg" width="100" height="100" class="b">
<img src="images (1).jpg" width="100" height="100" class="c">
<img src="images (1).jpg" width="100" height="100" class="d">
<img src="images (1).jpg" width="100" height="100" class="e">
<img src="images (1).jpg" width="100" height="100" class="f">
</body>
</html>
